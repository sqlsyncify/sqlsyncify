Name: sqlsyncify-api
Host: 0.0.0.0
Port: 8080
# milliseconds
Timeout: 1800000
Verbose: false
Log:
  #Mode: file,console
  Encoding: plain
Telemetry:
  Disable: true

# URL Elasticsearch uses to fetch /synonym/{site}/{lang}. No credentials in this value.
AppHost: "http://127.0.0.1:8080"

# Admin routes (/sync/all, /clean/noalias) fail closed until a token is set.
# Prefer the SQLSYNCIFY_AUTH_TOKEN environment variable over committing a secret.
# AuthToken: ""

MaxBytes: 1048576

Middlewares:
  Trace: false
  Prometheus: false
  MaxConns: true
  Breaker: false
  Shedding: false
  Timeout: true
  Recover: true
  Metrics: false
  Log: true
  MaxBytes: true
  Gunzip: false
